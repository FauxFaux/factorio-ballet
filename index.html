    <script type="module" async src="/src/main.tsx"></script>
    <script>
      function preloadImage(u) {
        const d = new Image();
        d.src = u;
        d.decode().catch((err) => console.log("preload failed, ignoring", u, err));
      }
      INJECT_ICONS_ARRAY.map((u, i) => setTimeout(() => preloadImage(u), i * 100));
    </script>
